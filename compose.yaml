services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: collaboration
      POSTGRES_USER: collaboration
      POSTGRES_PASSWORD: collaboration
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "collaboration", "-d", "collaboration"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://collaboration:collaboration@db:5432/collaboration
      SERVER_OPERATOR_USER_IDS: "${SERVER_OPERATOR_USER_IDS:-}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/openapi.json', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
