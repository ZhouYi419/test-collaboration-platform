server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/issues/ {
        client_max_body_size 51m;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
