<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>测试协作平台</title>
  <link rel="stylesheet" href="../../../frontend/src/styles.css">
  <link rel="stylesheet" href="../../../frontend/src/admin.css">
  <link rel="stylesheet" href="../../../frontend/src/workspace.css">
  <link rel="stylesheet" href="../../../frontend/src/accounts.css">
  <link rel="stylesheet" href="../../../frontend/src/issues.css">
  <link rel="stylesheet" href="../../../frontend/src/issue-review.css">
  <link rel="stylesheet" href="prototype.css">
  <script src="prototype.js" defer></script>
</head>
<body>
  <div class="account-workspace issue-workspace">
    <header class="workspace-header" id="workspace-header">
      <div class="workspace-header-inner">
        <div class="workspace-brand wordmark"><span class="brand-mark" aria-hidden="true"></span>测试协作平台</div>
        <nav class="workspace-nav" aria-label="工作区导航" id="workspace-nav"></nav>
        <div class="workspace-identity">
          <div class="message-rail" id="message-rail" hidden>
            <button class="message-trigger" id="message-trigger" type="button" aria-label="消息"
              aria-haspopup="dialog" aria-controls="message-panel" aria-expanded="false" title="消息"></button>
            <dialog class="message-panel" id="message-panel" aria-labelledby="message-title">
              <header class="message-panel-head">
                <h2 id="message-title">消息</h2>
                <button class="message-mark" type="button" data-action="bulk">全部标为已读</button>
                <button class="message-close" type="button" data-action="close-panel" aria-label="关闭消息"></button>
              </header>
              <div class="message-body" id="message-body"></div>
            </dialog>
          </div>
          <div class="identity-profile" id="identity"></div>
        </div>
      </div>
    </header>
    <aside class="message-toast" aria-label="新消息提示" id="toast" hidden></aside>
    <main class="admin-layout">
      <div class="workspace-content"><div class="issue-surface" id="view"></div></div>
    </main>
    <p class="sr-only" id="announcement" role="status"></p>
    <dialog class="leave-dialog" id="leave-dialog" aria-labelledby="leave-title">
      <form method="dialog">
        <h2 id="leave-title">放弃未提交的处理说明？</h2>
        <p>离开后，当前输入会丢失。</p>
        <div class="leave-actions">
          <button class="admin-button" value="stay" autofocus>继续编辑</button>
          <button class="admin-primary" value="leave">放弃并离开</button>
        </div>
      </form>
    </dialog>
  </div>
  <footer class="review-controls" aria-label="原型评审入口">
    <span>原型评审</span>
    <a href="index.html?panel=1#tester/issues">测试消息</a>
    <a href="index.html?panel=1#developer/issues">开发消息</a>
    <a href="index.html?case=arrival#developer/work">编辑时收到消息</a>
    <a href="index.html?case=burst#tester/issues">同时收到多条</a>
    <a href="index.html?panel=1&amp;case=empty#tester/issues">空列表</a>
    <a href="index.html?panel=1&amp;case=loading#tester/issues">加载中</a>
    <a href="index.html?panel=1&amp;case=load-error#tester/issues">读取失败</a>
    <a href="index.html?panel=1&amp;case=read-error#developer/issues">标记失败</a>
    <a href="index.html?panel=1&amp;case=read-one-error#developer/issues">单条标记失败</a>
    <a href="index.html?panel=1&amp;case=detail-error#tester/issues">详情读取失败</a>
    <a href="index.html?panel=1&amp;case=unavailable#tester/issues">事项不可用</a>
    <a href="index.html?panel=1&amp;case=more#tester/issues">加载更早消息</a>
    <a href="index.html#admin/issues">管理员视角</a>
    <button type="button" id="simulate">模拟收到消息</button>
  </footer>
</body>
</html>
