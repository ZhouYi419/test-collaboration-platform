<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>测试协作平台</title>
  <link rel="stylesheet" href="../../../frontend/src/styles.css">
  <link rel="stylesheet" href="../../../frontend/src/admin.css">
  <link rel="stylesheet" href="../../../frontend/src/workspace.css">
  <link rel="stylesheet" href="../../../frontend/src/issues.css">
  <link rel="stylesheet" href="../../../frontend/src/issue-review.css">
  <link rel="stylesheet" href="prototype.css">
  <script src="prototype.js" defer></script>
</head>
<body>
  <div class="account-workspace issue-workspace">
    <header class="workspace-header">
      <div class="workspace-header-inner">
        <div class="workspace-brand wordmark"><span class="brand-mark" aria-hidden="true"></span>测试协作平台</div>
        <nav class="workspace-nav" aria-label="工作区导航" id="workspace-nav"></nav>
        <div class="workspace-identity" id="identity"></div>
      </div>
    </header>
    <main class="admin-layout"><div class="workspace-content"><div class="issue-surface" id="view"></div></div></main>
    <dialog class="account-editor issue-confirm" id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <form method="dialog">
        <div class="editor-body"><h2 id="confirm-title"></h2><p id="confirm-message"></p></div>
        <div class="editor-actions">
          <button class="admin-button" value="cancel" autofocus>取消</button>
          <button class="admin-primary" value="confirm" id="confirm-action"></button>
        </div>
      </form>
    </dialog>
    <p class="announcement" role="status" id="announcement"></p>
  </div>
  <footer class="review-controls" aria-label="原型评审控制">
    <span>原型评审</span>
    <a class="admin-button" href="#tester" data-route>切换至测试</a>
    <a class="admin-button" href="#developer/assigned" data-route>打开开发待办</a>
    <a class="admin-button" href="#developer/feedback" data-route>打开开发已反馈</a>
    <button class="admin-button" type="button" data-action="reset">重置示例</button>
  </footer>
</body>
</html>
