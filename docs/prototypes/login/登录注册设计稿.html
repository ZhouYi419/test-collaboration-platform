<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>测试协作平台</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei UI",sans-serif;color:#edf1fa;background:#0b0e17;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 16% 2%,#233756 0,transparent 40%),radial-gradient(ellipse at 78% 90%,#191e3c 0,transparent 38%),#0b0e17}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(120deg,#000,transparent 70%)}.shell{position:relative;min-height:100vh;display:flex;flex-direction:column}.header{height:88px;padding:0 clamp(24px,5vw,80px);display:flex;align-items:center;gap:12px}.logo{width:33px;height:33px;border:1px solid #a8c7ff55;background:linear-gradient(145deg,#6b96e9,#3a4c88);border-radius:10px;box-shadow:0 4px 24px #759bff44;display:grid;place-items:center}.logo svg{width:20px;height:20px}.brand{font-size:14px;letter-spacing:.08em;font-weight:650;color:#e1e8f5}.main{flex:1;display:grid;grid-template-columns:minmax(300px,1fr) minmax(410px,520px);align-items:center;max-width:1350px;width:100%;margin:0 auto;padding:26px clamp(24px,6vw,80px) 90px;gap:clamp(40px,8vw,150px)}.visual{height:min(560px,62vh);min-height:390px;position:relative;display:grid;place-items:center;overflow:hidden}.visual:before,.visual:after{content:"";position:absolute;border:1px solid #a5c6ff20;border-radius:50%;width:420px;height:420px;transform:rotateX(63deg) rotateZ(-30deg);box-shadow:0 0 90px #688dff18,inset 0 0 80px #7197ff0a}.visual:after{width:310px;height:310px;transform:rotateX(63deg) rotateZ(45deg);border-color:#b9cfff35}.glass{position:relative;z-index:1;width:min(310px,70%);aspect-ratio:1;border-radius:72px;transform:rotate(-12deg);background:linear-gradient(145deg,#a6c5ff35,#6675c315 42%,#8a94f12c);border:1px solid #d5e6ff45;box-shadow:0 45px 100px #0007,inset 0 1px 2px #ffffff45,inset 0 -16px 55px #7588ff16;backdrop-filter:blur(24px);display:grid;place-items:center}.glass svg{width:48%;transform:rotate(12deg);filter:drop-shadow(0 8px 20px #739efb55)}.orb{position:absolute;width:9px;height:9px;background:#abc9ff;border-radius:50%;box-shadow:0 0 24px 8px #83adff88}.o1{top:22%;left:27%}.o2{bottom:22%;right:17%;width:5px;height:5px}.card{width:100%;background:linear-gradient(145deg,#202838e8,#151a27eb);border:1px solid #ffffff18;box-shadow:0 35px 110px #0007,0 1px 0 #ffffff0c inset;border-radius:22px;padding:clamp(30px,4vw,48px);backdrop-filter:blur(28px)}.eyebrow{font-size:11px;letter-spacing:.18em;color:#8ba5ca;font-weight:600;margin-bottom:14px}.heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:31px}h1{font-size:30px;line-height:1.2;letter-spacing:-.04em;margin:0;font-weight:650}.toplink,.link{color:#a9c9ff;text-decoration:none;font-size:13px;white-space:nowrap}.toplink:hover,.link:hover{text-decoration:underline}.field{margin:0 0 18px}label{display:block;color:#cbd5e5;font-size:12px;font-weight:600;margin-bottom:9px}input{width:100%;height:50px;border:1px solid #ffffff1b;border-radius:10px;background:#0c111bc9;padding:0 15px;font:inherit;font-size:14px;color:#f6f8ff;outline:none;transition:border-color .18s,box-shadow .18s}input::placeholder{color:#727f92}input:focus{border-color:#8fb7ff;box-shadow:0 0 0 3px #7ba9ff24}.inputwrap{position:relative}.inputwrap input{padding-right:64px}.reveal{position:absolute;right:10px;top:9px;height:32px;border:0;background:transparent;color:#99aac2;font-size:12px;cursor:pointer;padding:0 7px;border-radius:6px}.reveal:hover{color:white;background:#ffffff0c}.hint{min-height:18px;margin:6px 0 0;color:#f6a7aa;font-size:12px;line-height:1.5}.primary{height:50px;width:100%;border:0;border-radius:10px;background:linear-gradient(115deg,#a5c9ff,#829df0);color:#111a2c;font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:filter .2s,transform .2s}.primary:hover{filter:brightness(1.08)}.primary:active{transform:scale(.99)}.secondary{display:block;margin:22px auto 0;background:none;border:0;color:#a9c9ff;font:inherit;font-size:13px;cursor:pointer}.errorbox{display:none;margin:0 0 17px;border:1px solid #dc8c9244;border-radius:9px;padding:11px 12px;color:#ffc0c1;background:#a6333c18;font-size:12px;line-height:1.6}.errorbox.visible{display:block}.success{padding:15px 0 5px;text-align:center}.check{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#89cfb11e;color:#a9e9c7;margin:0 auto 22px;border:1px solid #a9e9c74d}.success h1{font-size:25px}.success p{color:#adb9cd;font-size:14px;line-height:1.8;margin:16px 0 28px}.footer{font-size:11px;color:#728098;padding:0 clamp(24px,5vw,80px) 28px;letter-spacing:.03em}.hidden{display:none!important}:focus-visible{outline:2px solid #a7caff;outline-offset:3px}@media(max-width:820px){.main{display:block;max-width:560px;padding-top:24px}.visual{height:160px;min-height:160px;margin-bottom:26px}.glass{width:112px;border-radius:30px}.visual:before{width:215px;height:215px}.visual:after{width:155px;height:155px}.o1{left:28%}.o2{right:27%}.header{height:70px}.card{padding:32px 28px}.footer{text-align:center}}@media(max-width:400px){.main{padding-left:16px;padding-right:16px}.card{padding:27px 22px}.heading{margin-bottom:26px}h1{font-size:27px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="shell"><header class="header"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 15 9 10l3 3 7-7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="19" cy="6" r="1.5" fill="white"/></svg></span><span class="brand">测试协作平台</span></header><main class="main"><div class="visual" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><div class="glass"><svg viewBox="0 0 120 120" fill="none"><rect x="20" y="20" width="80" height="80" rx="25" stroke="#D5E6FF" stroke-opacity=".55" stroke-width="2"/><path d="M34 65 51 48l12 12 23-25" stroke="#DDEAFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M35 80h50" stroke="#B2CEFF" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/></svg></div></div><section class="card" aria-live="polite"><div id="login"><div class="eyebrow">ACCOUNT</div><div class="heading"><h1>登录</h1><a href="#register" class="toplink" data-go="register">创建账号 →</a></div><form id="loginForm" novalidate><div id="loginError" class="errorbox" role="alert"></div><div class="field"><label for="identity">用户名或邮箱</label><input id="identity" autocomplete="username" placeholder="输入用户名或邮箱"><p class="hint" id="identityError"></p></div><div class="field"><label for="loginPassword">密码</label><div class="inputwrap"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="输入密码"><button type="button" class="reveal" data-target="loginPassword" aria-label="显示密码">显示</button></div><p class="hint" id="loginPasswordError"></p></div><button class="primary" type="submit">登录</button></form></div><div id="register" class="hidden"><div class="eyebrow">ACCOUNT</div><div class="heading"><h1>创建账号</h1><a href="#login" class="toplink" data-go="login">返回登录</a></div><form id="registerForm" novalidate><div class="field"><label for="username">用户名</label><input id="username" autocomplete="username" placeholder="输入用户名"><p class="hint" id="usernameError"></p></div><div class="field"><label for="email">邮箱</label><input id="email" type="email" autocomplete="email" placeholder="输入邮箱"><p class="hint" id="emailError"></p></div><div class="field"><label for="password">密码</label><div class="inputwrap"><input id="password" type="password" autocomplete="new-password" placeholder="至少 8 位"><button type="button" class="reveal" data-target="password" aria-label="显示密码">显示</button></div><p class="hint" id="passwordError"></p></div><div class="field"><label for="confirm">确认密码</label><div class="inputwrap"><input id="confirm" type="password" autocomplete="new-password" placeholder="再次输入密码"><button type="button" class="reveal" data-target="confirm" aria-label="显示确认密码">显示</button></div><p class="hint" id="confirmError"></p></div><button class="primary" type="submit">注册</button></form></div><div id="success" class="success hidden"><div class="check" aria-hidden="true"><svg width="27" height="27" viewBox="0 0 24 24" fill="none"><path d="m5 12 4.5 4.5L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1>注册成功</h1><p>请等待管理员启用账号。</p><button class="primary" data-go="login">返回登录</button></div></section></main><footer class="footer">测试协作平台</footer></div><script>
const $=id=>document.getElementById(id),go=id=>{['login','register','success'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.hint').forEach(x=>x.textContent='');$('loginError').classList.remove('visible');history.replaceState(null,'','#'+id);window.scrollTo(0,0)};document.querySelectorAll('[data-go]').forEach(x=>x.addEventListener('click',e=>{e.preventDefault();go(x.dataset.go)}));document.querySelectorAll('[data-target]').forEach(x=>x.addEventListener('click',()=>{const el=$(x.dataset.target),show=el.type==='password';el.type=show?'text':'password';x.textContent=show?'隐藏':'显示';x.setAttribute('aria-label',(show?'隐藏':'显示')+(x.dataset.target==='confirm'?'确认密码':'密码'))}));$('loginForm').addEventListener('submit',e=>{e.preventDefault();let a=$('identity').value.trim(),p=$('loginPassword').value;$('identityError').textContent=a?'':'请输入用户名或邮箱';$('loginPasswordError').textContent=p?'':'请输入密码';if(a&&p){$('loginError').textContent='无法连接，请稍后重试';$('loginError').classList.add('visible')}});$('registerForm').addEventListener('submit',e=>{e.preventDefault();let u=$('username').value.trim(),m=$('email').value.trim(),p=$('password').value,c=$('confirm').value;$('usernameError').textContent=u?'':'请输入用户名';$('emailError').textContent=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)?'':'请输入有效的邮箱';$('passwordError').textContent=p.length>=8?'':'密码至少 8 位';$('confirmError').textContent=c&&c===p?'':'两次密码输入不一致';if(u&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)&&p.length>=8&&c===p)go('success')});
</script></body></html>
