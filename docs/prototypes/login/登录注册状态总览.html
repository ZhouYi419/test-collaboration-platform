<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录注册 · 原型状态查看</title><style>*{box-sizing:border-box}body{margin:0;background:#e9edf4;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei UI",sans-serif}.bar{min-height:70px;display:flex;align-items:center;gap:16px;padding:14px 24px;background:white;border-bottom:1px solid #d9dfeb;flex-wrap:wrap;color:#242d3d}.bar strong{font-size:14px}.bar label{font-size:13px;margin-left:auto}select{border:1px solid #bbc5d6;border-radius:9px;padding:10px 30px 10px 12px;font:inherit;background:white;color:#1b2638;max-width:100%}a{font-size:13px;color:#275aaa}.frame{width:100%;height:calc(100vh - 70px);border:0;background:#0b0e17;display:block}@media(max-width:600px){.bar label{margin-left:0}.frame{height:calc(100vh - 125px)}}</style></head><body><div class="bar"><strong>登录注册 · 状态查看</strong><label for="state">选择状态</label><select id="state"><option value="login">登录</option><option value="login_empty">登录 · 必填校验</option><option value="login_visible">登录 · 密码显示</option><option value="login_loading">登录 · 提交中</option><option value="login_invalid">登录 · 账号或密码错误</option><option value="login_pending">登录 · 账号未启用</option><option value="login_network">登录 · 网络错误</option><option value="reg">注册</option><option value="reg_empty">注册 · 必填校验</option><option value="reg_email">注册 · 邮箱格式错误</option><option value="reg_password">注册 · 密码不足 8 位</option><option value="reg_mismatch">注册 · 密码不一致</option><option value="reg_username_taken">注册 · 用户名重复</option><option value="reg_email_taken">注册 · 邮箱重复</option><option value="reg_loading">注册 · 提交中</option><option value="reg_network">注册 · 网络错误</option><option value="reg_success">注册 · 等待启用</option></select><a id="open" href="登录注册状态原型.html?state=login" target="_blank">单独打开</a></div><iframe class="frame" id="preview" title="登录注册界面预览" src="登录注册状态原型.html?state=login"></iframe><script>let s=document.getElementById('state'),f=document.getElementById('preview'),a=document.getElementById('open');s.addEventListener('change',()=>{let u='登录注册状态原型.html?state='+encodeURIComponent(s.value);f.src=u;a.href=u});</script></body></html>
